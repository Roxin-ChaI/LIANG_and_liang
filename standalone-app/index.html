<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self'; style-src 'self'; img-src 'self' data:;">
  <title>Liang no Henshin</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none; }
    #stage { position: relative; width: 256px; height: 256px; background: transparent; }
    #pet { position: absolute; left: 32px; top: 24px; width: 192px; height: 208px;
      background-repeat: no-repeat; image-rendering: pixelated; touch-action: none; cursor: grab; }
    #pet.dragging { cursor: grabbing; }
    #overlay { position: absolute; display: none; pointer-events: none; image-rendering: pixelated; max-width: none; }
  </style>
</head>
<body>
  <div id="stage"><div id="pet" role="img" aria-label="Liang pet"></div><img id="overlay" alt=""></div>
  <script type="module" src="renderer.mjs"></script>
</body>
</html>
